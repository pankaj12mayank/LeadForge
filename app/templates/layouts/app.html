{% extends "base.html" %}
{% set active_page = active_page or 'dashboard' %}

{% block body %}
<div class="lf" style="box-sizing:border-box;position:relative;display:flex;flex-wrap:wrap">

  <!-- SIDEBAR -->
  <aside style="flex:1 1 248px;max-width:100%;min-width:220px;box-sizing:border-box;padding:22px 16px;border-right:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column;gap:22px">
    <a href="/" style="display:flex;align-items:center;gap:10px;padding:0 8px" aria-label="LeadForge home">
      <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--acc)"></rect><path d="M8 10h24v6H8z" fill="var(--accfg)"></path><path d="M11 18h18l-5 8v3h-8v-3z" fill="var(--accfg)"></path><rect x="12" y="31" width="16" height="3" rx="1.5" fill="var(--accfg)"></rect></svg>
      <span class="disp" style="font-weight:700;font-size:19px">LeadForge</span>
    </a>
    <button class="lf-btn" onclick="location.href='/searches'" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:700;font-size:14px;min-height:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New search</button>
    <nav aria-label="Main" style="display:flex;flex-direction:column;gap:4px">
      <a href="/dashboard" class="lf-nav {% if active_page=='dashboard' %}lf-card{% endif %}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:{{ '#'+('surf' if active_page=='dashboard' else 'transparent') }};color:{{ 'fg' if active_page=='dashboard' else 'fg' }};font-weight:700;font-size:14px;text-align:left;min-height:44px" style="background:{{ 'var(--surf)' if active_page=='dashboard' else 'transparent' }};color:{{ 'var(--fg)' if active_page=='dashboard' else 'var(--fg)' }};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 4.06L9 12l.26 2.86A7.75 7.75 0 0 1 3 12z"></path></svg>Dashboard
      </a>
      <a href="/searches" class="lf-nav {% if active_page=='searches' %}lf-card{% endif %}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:{{ 'var(--surf)' if active_page=='searches' else 'transparent' }};color:var(--fg);font-weight:700;font-size:14px;text-align:left;min-height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg>Find leads
      </a>
      <a href="/leads" class="lf-nav {% if active_page=='leads' %}lf-card{% endif %}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:{{ 'var(--surf)' if active_page=='leads' else 'transparent' }};color:var(--fg);font-weight:700;font-size:14px;text-align:left;min-height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>Leads
      </a>
      <a href="/jobs/{{ latest_job.id if latest_job else 0 }}" class="lf-nav {% if active_page=='jobs' %}lf-card{% endif %}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:{{ 'var(--surf)' if active_page=='jobs' else 'transparent' }};color:var(--fg);font-weight:700;font-size:14px;text-align:left;min-height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4 9l4 4 4-4M20 9l-4 4-4-4"></path></svg>Jobs
      </a>
    </nav>
    <div style="margin-top:auto;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--bg)">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>Credits</span><span class="mono">{{ credits }} / 50</span></div>
      <div style="margin-top:10px;height:8px;border-radius:6px;background:var(--surf2);overflow:hidden"><div style="width:{{ credit_pct }}%;height:100%;background:var(--acc);border-radius:6px;transition:width .6s"></div></div>
      <div style="margin-top:10px;font-size:12px;color:var(--mut)">Starter plan, trial ends in 7 days</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div style="flex:999 1 560px;min-width:0">
    <header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--bg)">
      <div><h1 style="margin:0;font-size:26px;font-weight:700">{{ page_title }}</h1><div style="font-size:13px;color:var(--mut);margin-top:3px">{{ page_sub }}</div></div>
      <div style="display:flex;align-items:center;gap:10px;position:relative">
        <button class="lf-btn lf-ghost" onclick="lfToggleTheme()" aria-label="Toggle light and dark theme" style="width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--fg);display:flex;align-items:center;justify-content:center">
          {% if dark %}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          {% else %}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          {% endif %}
        </button>
        <div style="position:relative">
          <button class="lf-btn lf-ghost" style="position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--fg);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:2px solid var(--surf)"></span></button>
        </div>
        <div style="position:relative">
          <button class="lf-btn lf-ghost" style="display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--fg);min-height:44px"><span class="disp" style="width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">{{ user.name[0] if user.name else user.email[0] if user.email else 'U' }}</span><span style="font-size:14px;font-weight:700">{{ user.name or user.email }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </div>
      </div>
    </header>

    <div style="padding:28px 32px 56px">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
