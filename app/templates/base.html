<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeadForge{% endblock %}</title>

  <!-- Google Fonts: Sora (headings), Manrope (UI), JetBrains Mono (numbers/data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System Tokens & Classes -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- No-flash theme loader -->
  <script>
    (function(){
      var KEY = 'lf-theme';
      var saved = localStorage.getItem(KEY);
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  {% block extra_head %}{% endblock %}
</head>
<body class="lf" style="min-height:100vh;display:flex;flex-direction:column;">
  {% block body %}{% endblock %}

  <!-- Toast Container -->
  <div id="lf-toast-container" class="lf-toast-container" style="position:fixed;right:24px;bottom:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

  <!-- Global Modal Container -->
  <div id="lf-modal-overlay" class="lf-ov" style="display:none;position:fixed;inset:0;background:rgba(8,10,14,.62);backdrop-filter:blur(3px);z-index:9000;" onclick="lfCloseModal()"></div>
  <div id="lf-modal" class="lf-modal" style="display:none;position:fixed;inset:0;z-index:9100;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;" role="dialog" aria-modal="true">
    <div id="lf-modal-content" class="lf-card" style="position:relative;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow-h);box-sizing:border-box;">
      <button id="lf-modal-close-btn" class="lf-btn lf-ghost" onclick="lfCloseModal()" aria-label="Close dialog" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
      <div id="lf-modal-body"></div>
    </div>
  </div>

  <script>
    // Theme toggle
    window.lfToggleTheme = function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lf-theme', next);
      document.querySelectorAll('.lf-theme-icon-sun').forEach(function(el){ el.style.display = next === 'dark' ? 'block' : 'none'; });
      document.querySelectorAll('.lf-theme-icon-moon').forEach(function(el){ el.style.display = next === 'dark' ? 'none' : 'block'; });
    };

    // Toasts
    window.lfShowToast = function(kind, title, msg) {
      var container = document.getElementById('lf-toast-container');
      if (!container) return;
      var color = 'var(--acc2)';
      if (kind === 'ok') color = 'var(--ok)';
      else if (kind === 'warn') color = 'var(--warn)';
      else if (kind === 'bad' || kind === 'error') color = 'var(--bad)';

      var el = document.createElement('div');
      el.className = 'lf-toast';
      el.setAttribute('role', 'status');
      el.style.cssText = 'pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border:1px solid var(--line);border-left:4px solid ' + color + ';border-radius:14px;background:var(--surf);box-shadow:var(--shadow-h);min-width:280px;max-width:380px;';
      
      var textDiv = document.createElement('div');
      textDiv.style.cssText = 'flex:1;min-width:0;';
      if (title) {
        var t = document.createElement('div');
        t.style.cssText = 'font-weight:700;font-size:14px;color:var(--fg);';
        t.textContent = title;
        textDiv.appendChild(t);
      }
      if (msg) {
        var m = document.createElement('div');
        m.style.cssText = 'font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4;';
        m.textContent = msg;
        textDiv.appendChild(m);
      }
      el.appendChild(textDiv);

      var closeBtn = document.createElement('button');
      closeBtn.setAttribute('aria-label', 'Dismiss toast');
      closeBtn.style.cssText = 'width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;';
      closeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>';
      closeBtn.onclick = function() { el.remove(); };
      el.appendChild(closeBtn);

      container.appendChild(el);
      setTimeout(function() {
        if (el.parentNode) el.remove();
      }, 3400);
    };

    // Modal
    var lfLastFocused = null;
    window.lfOpenModal = function(htmlContentOrId) {
      lfLastFocused = document.activeElement;
      var modal = document.getElementById('lf-modal');
      var overlay = document.getElementById('lf-modal-overlay');
      var body = document.getElementById('lf-modal-body');
      
      var content = htmlContentOrId;
      var el = document.getElementById(htmlContentOrId);
      if (el) {
        content = el.innerHTML;
      }
      body.innerHTML = content;
      modal.style.display = 'flex';
      overlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
      
      var closeBtn = document.getElementById('lf-modal-close-btn');
      if (closeBtn) closeBtn.focus();
    };

    window.lfCloseModal = function(id) {
      if (id) {
        var specific = document.getElementById(id);
        if (specific) specific.style.display = 'none';
      }
      var modal = document.getElementById('lf-modal');
      var overlay = document.getElementById('lf-modal-overlay');
      if (modal) modal.style.display = 'none';
      if (overlay) overlay.style.display = 'none';
      var body = document.getElementById('lf-modal-body');
      if (body) body.innerHTML = '';
      
      var anyOpen = false;
      document.querySelectorAll('.lf-ov').forEach(function(ov){
        if (ov.style.display !== 'none') anyOpen = true;
      });
      if (!anyOpen) {
        document.body.style.overflow = '';
      }
      if (lfLastFocused && lfLastFocused.focus) {
        try { lfLastFocused.focus(); } catch(e){}
      }
    };

    // Escape listener for modal and dropdowns
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var modal = document.getElementById('lf-modal');
        if (modal && modal.style.display !== 'none') {
          lfCloseModal();
        }
        document.querySelectorAll('.lf-ov').forEach(function(ov){
          ov.style.display = 'none';
        });
        document.body.style.overflow = '';
        // Also close any open dropdowns
        document.querySelectorAll('.lf-dropdown-menu').forEach(function(menu){
          menu.style.display = 'none';
        });
      }
    });

    // Dropdown helper
    window.lfToggleDropdown = function(id, evt) {
      if (evt) evt.stopPropagation();
      var el = document.getElementById(id);
      if (!el) return;
      var isOpen = el.style.display === 'block';
      document.querySelectorAll('.lf-dropdown-menu').forEach(function(m){ m.style.display = 'none'; });
      el.style.display = isOpen ? 'none' : 'block';
      var btn = el.previousElementSibling;
      if (btn && btn.setAttribute) btn.setAttribute('aria-expanded', !isOpen);
    };

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.lf-dropdown-wrapper')) {
        document.querySelectorAll('.lf-dropdown-menu').forEach(function(m){
          m.style.display = 'none';
          var btn = m.previousElementSibling;
          if (btn && btn.setAttribute) btn.setAttribute('aria-expanded', 'false');
        });
      }
    });

    // HTMX toast listener
    document.body.addEventListener('htmx:afterRequest', function(evt) {
      var xhr = evt.detail.xhr;
      if (!xhr) return;
      var trigger = xhr.getResponseHeader('HX-Trigger');
      if (!trigger) return;
      try {
        var payload = JSON.parse(trigger);
        if (payload && payload.toast) {
          var t = payload.toast;
          window.lfShowToast(t.kind || 'ok', t.title || '', t.msg || '');
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
