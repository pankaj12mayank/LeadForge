{% extends "layouts/public.html" %}
{% block title %}Forgot password — LeadForge{% endblock %}

{% block content %}
<section style="max-width:400px;margin:40px auto;padding:20px;">
  <div class="lf-card" style="border:1px solid var(--line);border-radius:16px;padding:32px;text-align:left;">
    <h2 style="font-size:24px;margin:0 0 8px;font-family:Sora;">Forgot password</h2>
    <p style="font-size:13px;color:var(--mut);margin:0 0 24px;">Enter your email and we&rsquo;ll send a reset link (dev: logged to console).</p>

    <form method="post" action="/auth/forgot">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--fg);margin-bottom:6px;">Email</label>
        <input type="email" name="email" required
          style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--fg);font-size:14px;">
      </div>

      <button class="lf-btn" style="width:100%;padding:12px;border-radius:10px;background:var(--acc);color:var(--accfg);border:none;font-weight:600;font-size:15px;">Send reset link</button>
    </form>

    <p style="font-size:13px;color:var(--mut);margin-top:20px;text-align:center;">
      Remember? <a href="/auth/login" class="lf-link" style="color:var(--acc);text-decoration:underline;">Sign in</a>
    </p>
  </div>
</section>
{% endblock %}
