{% extends "layouts/public.html" %}
{% block title %}Reset password — LeadForge{% endblock %}

{% block content %}
<section style="max-width:400px;margin:40px auto;padding:20px;">
  <div class="lf-card" style="border:1px solid var(--line);border-radius:16px;padding:32px;text-align:left;">
    <h2 style="font-size:24px;margin:0 0 8px;font-family:Sora;">Reset password</h2>
    <p style="font-size:13px;color:var(--mut);margin:0 0 24px;">Set a new password for your account.</p>

    <form method="post" action="/auth/reset">
      <input type="hidden" name="token" value="{{ token }}">

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--fg);margin-bottom:6px;">New password</label>
        <input type="password" name="password" required
          style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--fg);font-size:14px;">
      </div>

      <button class="lf-btn" style="width:100%;padding:12px;border-radius:10px;background:var(--acc);color:var(--accfg);border:none;font-weight:600;font-size:15px;">Reset password</button>
    </form>

    <p style="font-size:13px;color:var(--mut);margin-top:20px;text-align:center;">
      <a href="/auth/login" class="lf-link" style="color:var(--mut);text-decoration:underline;">Back to sign in</a>
    </p>
  </div>
</section>
{% endblock %}
