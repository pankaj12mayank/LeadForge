<span class="px-3 py-1 rounded text-xs font-semibold {{ 'bg-green-100 text-green-700' if job.status=='done' else 'bg-yellow-100 text-yellow-700 animate-pulse' if job.status=='running' else 'bg-slate-100 text-slate-700' }}">{{ job.status }}</span>
{% if job.error %}
  <div class="mt-2 text-red-600 text-sm">{{ job.error }}</div>
{% endif %}
{% if job.status == 'done' and job.result_summary %}
  <div class="mt-3 text-sm text-slate-600">
    Delivered: {{ job.result_summary.delivered }} / collected {{ job.result_summary.collected }} / deduplicated {{ job.result_summary.deduplicated }}
  </div>
{% endif %}
