services:
  - type: web
    name: leadforge-web
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
  - type: worker
    name: leadforge-worker
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: leadforge-db
    plan: starter
    ipAllowList: []
